name: Agentic Security Scan

on:
  workflow_dispatch:
    inputs:
      scan_job_id:
        description: 'Scan job identifier from AgentDeploy'
        required: true
      report_title:
        description: 'Title for generated report'
        required: true
      source_repo:
        description: 'owner/repo to scan (optional; defaults to current repo)'
        required: false
      source_installation_id:
        description: 'GitHub App installation id for source repo (optional)'
        required: false
      template_id:
        description: 'Template id in AgentDeploy (optional)'
        required: false
      template_version:
        description: 'Template version in AgentDeploy (optional)'
        required: false
      seller_id:
        description: 'Seller user id in AgentDeploy (optional)'
        required: false

jobs:
  secure_scan_and_report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: read
    env:
      SCANNER_APP_ID: ${{ secrets.SCANNER_APP_ID }}
      SCANNER_APP_PRIVATE_KEY: ${{ secrets.SCANNER_APP_PRIVATE_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Scanner image references. Pin these to immutable digests for supply-chain
      # hardening once, then bump deliberately:
      #   docker manifest inspect <image> | jq '.manifests[0].digest'
      TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:latest
      SEMGREP_IMAGE: semgrep/semgrep:latest
      OSV_SCANNER_IMAGE: gcr.io/osv-v4/osv-scanner:latest

    steps:
      - name: Resolve source repository
        id: source-repo
        shell: bash
        run: |
          SOURCE_REPO="${{ github.event.inputs.source_repo }}"
          if [ -z "$SOURCE_REPO" ]; then
            SOURCE_REPO="${{ github.repository }}"
          fi
          OWNER="${SOURCE_REPO%%/*}"
          REPO="${SOURCE_REPO#*/}"
          if [ -z "$OWNER" ] || [ -z "$REPO" ] || [ "$OWNER" = "$SOURCE_REPO" ]; then
            echo "Invalid source repo: $SOURCE_REPO" >&2
            exit 1
          fi
          echo "full=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "name=$REPO" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for source repository
        id: source-token
        if: ${{ env.SCANNER_APP_ID != '' && env.SCANNER_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SCANNER_APP_ID }}
          private-key: ${{ secrets.SCANNER_APP_PRIVATE_KEY }}
          owner: ${{ steps.source-repo.outputs.owner }}
          repositories: ${{ steps.source-repo.outputs.name }}

      - name: Validate GitHub App credentials
        if: ${{ env.SCANNER_APP_ID == '' || env.SCANNER_APP_PRIVATE_KEY == '' }}
        shell: bash
        run: |
          echo "Missing GitHub App credentials in workflow repository." >&2
          echo "Required secrets:" >&2
          echo "- app id: secrets.SCANNER_APP_ID" >&2
          echo "- private key: secrets.SCANNER_APP_PRIVATE_KEY" >&2
          exit 1

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source-repo.outputs.full }}
          token: ${{ steps.source-token.outputs.token || github.token }}
          fetch-depth: 1

      - name: Capture source commit
        id: source-commit
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------------
      # Scanner execution.
      #
      # Every scanner step always exits 0 so a finding never aborts the pipeline.
      # Tool health is tracked separately from findings: each step writes
      # status=success|error, and finding counts are derived from parsed JSON
      # in the normalization step below, never from exit codes.
      # ---------------------------------------------------------------------------

      - name: Run TruffleHog (secrets)
        id: trufflehog
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            "$TRUFFLEHOG_IMAGE" \
            filesystem /repo --results=verified,unknown --json > trufflehog-output.json 2> trufflehog-stderr.log
          CODE=$?
          set -e
          # TruffleHog may exit non-zero when findings are present; findings are
          # counted from JSON below. Only treat as tool error when no output.
          if [ -s trufflehog-output.json ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Run Semgrep (SAST)
        id: semgrep
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/security-audit \
              --config p/default \
              --config p/python \
              --config p/typescript \
              --config p/javascript \
              --json --output /src/semgrep-output.json > semgrep-run.log 2>&1
          CODE=$?
          set -e
          # Without --error, a non-zero exit means the tool itself failed.
          if [ $CODE -eq 0 ] && [ -s semgrep-output.json ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Run osv-scanner (dependency/SCA)
        id: osv
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            "$OSV_SCANNER_IMAGE" \
            scan --recursive /src --format json --output /src/osv-output.json > osv-run.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ] && [ ! -s osv-output.json ]; then
            # Older CLI without the scan subcommand.
            docker run --rm \
              -v "$PWD:/src" \
              -w /src \
              "$OSV_SCANNER_IMAGE" \
              -r /src --format json --output /src/osv-output.json >> osv-run.log 2>&1
            CODE=$?
          fi
          set -e
          # osv-scanner exits 1 when vulnerabilities are found; findings are
          # counted from JSON. Tool error only when no parsable output.
          if [ -s osv-output.json ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------------
      # Normalization + scoring. Produces:
      #   findings.json    - normalized, per-finding records (ingested by the
      #                      orchestrator into scan_findings in Phase 2)
      #   scan-result.json - aggregate result (schema-compatible with the
      #                      orchestrator's scanResultArtifactSchema)
      #   report.md        - human-readable report
      # ---------------------------------------------------------------------------
      - name: Normalize findings and compute scores
        if: ${{ always() }}
        shell: bash
        env:
          TOOL_TRUFFLEHOG: ${{ steps.trufflehog.outputs.status }}
          TOOL_SEMGREP: ${{ steps.semgrep.outputs.status }}
          TOOL_OSV: ${{ steps.osv.outputs.status }}
        run: |
          cat > normalize.py <<'PYEOF'
          import json
          import os
          from collections import Counter

          SEVERITY_ORDER = ["critical", "high", "medium", "low"]
          MAX_FINDINGS = 500

          def read_json(path, jsonl=False):
              if not os.path.isfile(path) or os.path.getsize(path) == 0:
                  return None
              try:
                  if jsonl:
                      out = []
                      with open(path) as fh:
                          for line in fh:
                              line = line.strip()
                              if not line:
                                  continue
                              try:
                                  out.append(json.loads(line))
                              except ValueError:
                                  pass
                      return out
                  with open(path) as fh:
                      return json.load(fh)
              except ValueError:
                  return None

          def clip(text, limit=200):
              text = (text or "").replace("\n", " ").replace("\r", " ").strip()
              return text[:limit]

          findings = []
          tool_errors = []

          # --- TruffleHog ---
          th = read_json("trufflehog-output.json", jsonl=True)
          if os.environ.get("TOOL_TRUFFLEHOG") != "success" or th is None:
              tool_errors.append("trufflehog")
          else:
              seen = set()
              for r in th:
                  meta = (r.get("SourceMetadata") or {}).get("Data") or {}
                  git = meta.get("Git") or {}
                  fs = meta.get("Filesystem") or meta.get("filesystem") or {}
                  fpath = git.get("file") or fs.get("file") or fs.get("path") or "unknown"
                  key = (r.get("DetectorName"), fpath)
                  if key in seen:
                      continue
                  seen.add(key)
                  verified = bool(r.get("Verified"))
                  findings.append({
                      "tool": "trufflehog",
                      "category": "secrets",
                      "severity": "critical" if verified else "medium",
                      "rule_id": r.get("DetectorName") or "secret",
                      "title": ("Verified secret: %s" % (r.get("DetectorName") or "unknown")) if verified
                               else ("Possible secret: %s" % (r.get("DetectorName") or "unknown")),
                      "file_path": fpath,
                      "line_start": int(git.get("line") or 0),
                      "line_end": int(git.get("line") or 0),
                      "description": "Potential hardcoded credential detected by TruffleHog"
                                     + (" (live/verified)" if verified else " (unverified match)"),
                      "evidence": clip(r.get("RawV2") or r.get("Raw") or ""),
                      "recommendation": "Remove the secret, rotate the credential, and use environment variables or a secrets manager.",
                  })

          # --- Semgrep ---
          sg = read_json("semgrep-output.json")
          if os.environ.get("TOOL_SEMGREP") != "success" or not isinstance(sg, dict):
              tool_errors.append("semgrep")
          else:
              sev_map = {"ERROR": "high", "WARNING": "medium", "INFO": "low"}
              for r in sg.get("results") or []:
                  extra = r.get("extra") or {}
                  findings.append({
                      "tool": "semgrep",
                      "category": "sast",
                      "severity": sev_map.get((extra.get("severity") or "").upper(), "low"),
                      "rule_id": r.get("check_id") or "semgrep-rule",
                      "title": clip(extra.get("message") or r.get("check_id") or "semgrep finding", 160),
                      "file_path": r.get("path") or "unknown",
                      "line_start": int((r.get("start") or {}).get("line") or 0),
                      "line_end": int((r.get("end") or {}).get("line") or 0),
                      "description": clip(extra.get("message") or ""),
                      "evidence": clip(extra.get("lines") or ""),
                      "recommendation": clip(extra.get("fix") or "Review the flagged code path and remediate per the rule guidance.", 200),
                  })

          # --- osv-scanner ---
          osv = read_json("osv-output.json")
          if os.environ.get("TOOL_OSV") != "success" or not isinstance(osv, dict):
              tool_errors.append("osv-scanner")
          else:
              def osv_severity(vuln):
                  ds = (vuln.get("database_specific") or {}).get("severity")
                  if isinstance(ds, str):
                      s = ds.upper()
                      if "CRIT" in s: return "critical"
                      if s == "HIGH": return "high"
                      if "MODERATE" in s or s == "MEDIUM": return "medium"
                      if s == "LOW": return "low"
                  for vec in vuln.get("severity") or []:
                      vector = vec.get("score") or ""
                      if vector.startswith("CVSS"):
                          try:
                              parts = dict(p.split(":", 1) for p in vector.split("/") if ":" in p)
                              base = 0.0
                              weights = {"AV": 0.4, "AC": 0.1, "PR": 0.2, "C": 0.15, "I": 0.1, "A": 0.05}
                              impact = {"C": 1.0, "H": 0.6, "L": 0.2}
                              for k, w in weights.items():
                                  base += w * impact.get(parts.get(k, "L"), 0.2)
                              score = base * 10
                              if score >= 9: return "critical"
                              if score >= 7: return "high"
                              if score >= 4: return "medium"
                              return "low"
                          except Exception:
                              pass
                  return "medium"

              for res in osv.get("results") or []:
                  src = res.get("source") or {}
                  spath = src.get("path") or "unknown"
                  for pkg in res.get("packages") or []:
                      pinfo = pkg.get("package") or {}
                      pname = "%s@%s" % (pinfo.get("name", "unknown"), pinfo.get("version", "?"))
                      for vuln in pkg.get("vulnerabilities") or []:
                          aliases = vuln.get("aliases") or []
                          vuln_id = vuln.get("id") or (aliases[0] if aliases else "OSV")
                          findings.append({
                              "tool": "osv-scanner",
                              "category": "dependencies",
                              "severity": osv_severity(vuln),
                              "rule_id": vuln_id,
                              "title": "Vulnerable dependency %s (%s)" % (pname, vuln_id),
                              "file_path": spath,
                              "line_start": 0,
                              "line_end": 0,
                              "description": clip(vuln.get("summary") or vuln.get("details") or "Known vulnerability in a dependency", 300),
                              "evidence": pname,
                              "recommendation": "Upgrade %s to a fixed version. See %s" % (pname, vuln.get("id") or "OSV database"),
                          })

          # Cap total findings to bound artifact size.
          findings = findings[:MAX_FINDINGS]

          counts = Counter(f["severity"] for f in findings)
          cat_counts = {}
          for f in findings:
              cat_counts.setdefault(f["category"], Counter())[f["severity"]] += 1
          error_cats = {}
          for err in tool_errors:
              cat = {"trufflehog": "secrets", "semgrep": "sast", "osv-scanner": "dependencies"}[err]
              error_cats[cat] = err
              cat_counts.setdefault(cat, Counter())["high"] += 1
              counts["high"] += 1

          def rating_for(c):
              score = 100 - 25 * c.get("critical", 0) - 10 * c.get("high", 0) \
                      - 3 * c.get("medium", 0) - 1 * c.get("low", 0)
              score = max(0, min(100, score))
              if score >= 90: return score, "A"
              if score >= 75: return score, "B"
              if score >= 60: return score, "C"
              if score >= 40: return score, "D"
              return score, "F"

          RANK = {"A": 0, "B": 1, "C": 2, "D": 3, "F": 4}
          LETTERS = ["A", "B", "C", "D", "F"]

          def worse(a, b):
              return a if RANK[a] >= RANK[b] else b

          overall_score, overall_rating = rating_for(counts)
          if tool_errors:
              # An unverifiable scan must never rate better than C.
              overall_rating = worse(overall_rating, "C")
          if counts.get("critical"): risk = "critical"
          elif counts.get("high"): risk = "high"
          elif counts.get("medium"): risk = "medium"
          elif counts.get("low"): risk = "low"
          else: risk = "none"

          cat_ratings = {}
          for cat in ["secrets", "sast", "dependencies"]:
              _, letter = rating_for(cat_counts.get(cat, Counter()))
              if cat in error_cats:
                  # Scanner error: coverage unknown, never better than C.
                  letter = worse(letter, "C")
              cat_ratings[cat] = letter
          # Not yet implemented analyzers; disclosed in summary. B = partial
          # coverage, deliberately publishable so the gate is not distorted.
          cat_ratings["promptInjection"] = "B"
          cat_ratings["permissions"] = "B"

          coverage = []
          if tool_errors:
              coverage.append("Tool errors: %s (treated as high-severity gaps)." % ", ".join(tool_errors))
          coverage.append("Prompt-injection and permissions analyzers are not yet enabled; those ratings are placeholders.")

          recs = []
          if counts.get("critical") or counts.get("high"):
              recs.append("Fix critical and high severity findings before publishing.")
          if cat_counts.get("secrets"):
              recs.append("Remove and rotate any exposed credentials; never commit secrets.")
          if cat_counts.get("dependencies"):
              recs.append("Upgrade vulnerable dependencies to fixed versions.")
          if cat_counts.get("sast"):
              recs.append("Review static-analysis findings and remediate per rule guidance.")
          if tool_errors:
              recs.append("Re-run the scan: one or more scanners failed to produce output.")
          if not recs:
              recs.append("No findings detected by the enabled scanners. Continue monitoring on each template version.")

          meta = {
              "scan_job_id": os.environ.get("SCAN_JOB_ID", ""),
              "template_id": os.environ.get("TEMPLATE_ID", ""),
              "template_version": os.environ.get("TEMPLATE_VERSION", ""),
              "repo": os.environ.get("SOURCE_REPO", ""),
              "commit": os.environ.get("SOURCE_COMMIT", ""),
              "run_id": os.environ.get("RUN_ID", ""),
          }

          with open("findings.json", "w") as fh:
              json.dump({"metadata": meta, "toolErrors": tool_errors, "findings": findings}, fh, indent=2)

          scan_result = {
              "overallRating": overall_rating,
              "overallScore": overall_score,
              "riskLevel": risk,
              "sourceCommitSha": meta["commit"],
              "templateVersion": meta["template_version"],
              "severityCounts": {
                  "low": counts.get("low", 0),
                  "medium": counts.get("medium", 0),
                  "high": counts.get("high", 0),
                  "critical": counts.get("critical", 0),
              },
              "categoryRatings": {
                  "secrets": cat_ratings["secrets"],
                  "promptInjection": cat_ratings["promptInjection"],
                  "dependencies": cat_ratings["dependencies"],
                  "permissions": cat_ratings["permissions"],
                  "sast": cat_ratings["sast"],
              },
              "summary": "Scan completed with TruffleHog, Semgrep and osv-scanner. %d findings. %s"
                         % (len(findings), " ".join(coverage)),
              "recommendations": recs,
          }
          with open("scan-result.json", "w") as fh:
              json.dump(scan_result, fh, indent=2)

          # --- report.md ---
          lines = []
          lines.append("# %s" % os.environ.get("REPORT_TITLE", "Security Scan Report"))
          lines.append("")
          lines.append("- Scan Job ID: %s" % (meta["scan_job_id"] or "n/a"))
          lines.append("- Template ID: %s" % (meta["template_id"] or "n/a"))
          lines.append("- Template Version: %s" % (meta["template_version"] or "n/a"))
          lines.append("- Repository: %s" % (meta["repo"] or "n/a"))
          lines.append("- Source Commit: %s" % (meta["commit"] or "unknown"))
          lines.append("- Run ID: %s" % (meta["run_id"] or "n/a"))
          lines.append("")
          lines.append("## Overall Result")
          lines.append("- Overall Rating: %s (%d/100)" % (overall_rating, overall_score))
          lines.append("- Risk Level: %s" % risk)
          lines.append("- Findings: critical=%d high=%d medium=%d low=%d (total=%d)"
                       % (counts.get("critical", 0), counts.get("high", 0),
                          counts.get("medium", 0), counts.get("low", 0), len(findings)))
          lines.append("- Category ratings: secrets=%s sast=%s dependencies=%s promptInjection=%s(B placeholder) permissions=%s(B placeholder)"
                       % (cat_ratings["secrets"], cat_ratings["sast"], cat_ratings["dependencies"],
                          cat_ratings["promptInjection"], cat_ratings["permissions"]))
          if tool_errors:
              lines.append("- Tool errors: %s" % ", ".join(tool_errors))
          lines.append("")
          lines.append("## Scanners Executed")
          lines.append("- TruffleHog (secrets): %s" % ("error" if "trufflehog" in tool_errors else "ok"))
          lines.append("- Semgrep p/security-audit,p/default,p/python,p/typescript,p/javascript (SAST): %s" % ("error" if "semgrep" in tool_errors else "ok"))
          lines.append("- osv-scanner (dependencies): %s" % ("error" if "osv-scanner" in tool_errors else "ok"))
          lines.append("- Prompt-injection / permissions analyzers: not yet implemented")
          lines.append("")
          if findings:
              lines.append("## Findings")
              lines.append("")
              sev_rank = {"critical": 0, "high": 1, "medium": 2, "low": 3}
              for f in sorted(findings, key=lambda x: sev_rank.get(x["severity"], 9))[:20]:
                  loc = f["file_path"]
                  if f["line_start"]:
                      loc += ":%d" % f["line_start"]
                  lines.append("- **[%s] %s** (%s / %s) - %s" % (f["severity"].upper(), f["rule_id"], f["tool"], loc, f["title"]))
              if len(findings) > 20:
                  lines.append("- ... and %d more (see findings.json artifact)" % (len(findings) - 20))
          else:
              lines.append("## Findings")
              lines.append("")
              lines.append("- No findings detected by the enabled scanners.")
          lines.append("")
          lines.append("## Recommendations")
          for r in recs:
              lines.append("- %s" % r)
          with open("report.md", "w") as fh:
              fh.write("\n".join(lines) + "\n")

          print("normalized %d findings; tool errors: %s" % (len(findings), tool_errors or "none"))
          PYEOF
          SCAN_JOB_ID="${{ github.event.inputs.scan_job_id }}" \
          TEMPLATE_ID="${{ github.event.inputs.template_id }}" \
          TEMPLATE_VERSION="${{ github.event.inputs.template_version }}" \
          REPORT_TITLE="${{ github.event.inputs.report_title }}" \
          SOURCE_REPO="${{ steps.source-repo.outputs.full }}" \
          SOURCE_COMMIT="${{ steps.source-commit.outputs.sha }}" \
          RUN_ID="${{ github.run_id }}" \
          python3 normalize.py

      - name: Install PDF tooling
        if: ${{ always() }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Convert markdown to PDF
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p pdf_output
          if [ -f report.md ]; then
            if ! pandoc report.md -o pdf_output/report.pdf --pdf-engine=wkhtmltopdf; then
              printf '%s\n' '<html><body><h1>Scan Report</h1><p>Primary markdown to PDF conversion failed. See artifacts for details.</p></body></html>' > pdf_output/fallback.html
              wkhtmltopdf pdf_output/fallback.html pdf_output/report.pdf
            fi
          else
            printf '%s\n' '<html><body><h1>Scan Report</h1><p>Report generation failed. See scan-result.json artifact.</p></body></html>' > pdf_output/fallback.html
            wkhtmltopdf pdf_output/fallback.html pdf_output/report.pdf
          fi

      - name: Upload report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Certified-Security-Report
          path: |
            pdf_output/report.pdf
            scan-result.json
            findings.json
            trufflehog-output.json
            semgrep-output.json
            osv-output.json
          retention-days: 7
          if-no-files-found: warn
